# project-2/playbooks/create-cluster.yml
- name: Create Kubernetes Cluster with Kops
  hosts: localhost
  become: no
  vars:
    cluster_name: "prod.k8s.mjatto.com"
    state_store: "s3://mjatto-kops-state"
  tasks:
    - name: Create HA cluster across 2 AZs
      shell: |
        export KOPS_CLUSTER_NAME={{ cluster_name }}
        export KOPS_STATE_STORE={{ state_store }}
        kops create cluster \
          --cloud=aws \
          --zones=us-east-1a,us-east-1b \
          --control-plane-zones=us-east-1a \
          --name=prod.k8s.mjatto.com \
          --state=s3://mjatto-kops-state \
          --node-count=2 \
          --node-size=t3.medium \
          --control-plane-size=t3.medium \
          --yes
